name: Import official competition feeds
on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import verified RSS/Atom feeds as drafts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BANDI_FEEDS_JSON: ${{ vars.BANDI_FEEDS_JSON }}
        run: python scripts/import_bandi.py
